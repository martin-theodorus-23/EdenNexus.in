<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EdenNexus | Checkout</title>
    <style>
        :root { --bg: #121212; --surface: #1e1e1e; --border: #2c2c2c; --text: #e0e0e0; --text-muted: #888; }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { margin: 0; background: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        .checkout-wrapper { width: 100%; max-width: 450px; margin-top: 8vh; padding: 0 1.5rem; margin-bottom: 2rem; }
        
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem; }
        .header h1 { font-size: 1.5rem; font-weight: 600; margin: 0; letter-spacing: -0.5px; }
        .btn-cancel { color: var(--text-muted); text-decoration: none; font-size: 0.9rem; transition: color 0.2s; }
        .btn-cancel:hover { color: #f87171; }
        
        .demo-warning {
            background: rgba(250, 204, 21, 0.1); border: 1px solid rgba(250, 204, 21, 0.2);
            color: #facc15; padding: 1rem; border-radius: 8px; font-size: 0.85rem;
            text-align: center; margin-bottom: 1.5rem; font-weight: 500;
        }

        form { background: var(--surface); padding: 2.5rem 2rem; border-radius: 12px; border: 1px solid var(--border); }
        .form-group { margin-bottom: 1.25rem; }
        .row { display: flex; gap: 1rem; }
        .row .form-group { flex: 1; }
        
        label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.5rem; }
        input {
            width: 100%; padding: 0.75rem 1rem; background: var(--bg); border: 1px solid var(--border);
            color: var(--text); border-radius: 6px; font-size: 0.95rem; transition: border-color 0.2s;
        }
        input:focus { outline: none; border-color: #555; }
        
        .summary { margin: 1.5rem 0; padding-top: 1.5rem; border-top: 1px solid var(--border); display: flex; justify-content: space-between; font-weight: 500; }
        
        .btn {
            width: 100%; padding: 0.85rem; background: #fff; color: #000; border: none;
            border-radius: 6px; font-weight: 500; font-size: 0.95rem; cursor: pointer;
            margin-top: 1rem; transition: background 0.2s;
        }
        .btn:hover { background: #e0e0e0; }
    </style>
</head>
<body>

    <div class="checkout-wrapper">
        <div class="header">
            <h1>Upgrade to {{ tier }}</h1>
            <a href="{{ url_for('plans') }}" class="btn-cancel">Cancel</a>
        </div>

        <div class="demo-warning">
            TEST MODE ACTIVE. Do not enter real credit card details. Any fake data will bypass the gateway.
        </div>

        <form method="POST" action="{{ url_for('checkout', tier=tier | lower) }}">
            <div class="form-group">
                <label for="name">Name on Card</label>
                <input type="text" id="name" placeholder="John Doe" required autocomplete="off">
            </div>
            
            <div class="form-group">
                <label for="card">Card Number</label>
                <input type="text" id="card" placeholder="0000 0000 0000 0000" required autocomplete="off" maxlength="19">
            </div>
            
            <div class="row">
                <div class="form-group">
                    <label for="exp">Expiry (MM/YY)</label>
                    <input type="text" id="exp" placeholder="12/26" required autocomplete="off" maxlength="5">
                </div>
                <div class="form-group">
                    <label for="cvc">CVC</label>
                    <input type="text" id="cvc" placeholder="123" required autocomplete="off" maxlength="4">
                </div>
            </div>

            <div class="summary">
                <span>Total Due Today:</span>
                <span>{% if tier|lower == 'pro' %}₹499{% else %}₹1499{% endif %}</span>
            </div>

            <button type="submit" class="btn">Simulate Payment</button>
        </form>
    </div>

</body>
</html>
