<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EdenNexus | Sign In</title>
    <style>
        :root { --bg: #121212; --surface: #1e1e1e; --border: #2c2c2c; --text: #e0e0e0; --text-muted: #888; }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { margin: 0; background: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        .auth-wrapper { width: 100%; max-width: 380px; margin-top: 10vh; padding: 0 1.5rem; }
        .brand { font-size: 1.5rem; font-weight: 600; text-align: center; margin-bottom: 2rem; letter-spacing: -0.5px; }
        
        form { background: var(--surface); padding: 2.5rem 2rem; border-radius: 12px; border: 1px solid var(--border); }
        .form-group { margin-bottom: 1.25rem; }
        label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.5rem; }
        input {
            width: 100%; padding: 0.75rem 1rem; background: var(--bg); border: 1px solid var(--border);
            color: var(--text); border-radius: 6px; font-size: 0.95rem; transition: border-color 0.2s;
        }
        input:focus { outline: none; border-color: #555; }
        
        .btn {
            width: 100%; padding: 0.85rem; background: #fff; color: #000; border: none;
            border-radius: 6px; font-weight: 500; font-size: 0.95rem; cursor: pointer;
            margin-top: 1rem; transition: background 0.2s;
        }
        .btn:hover { background: #e0e0e0; }
        
        .links { text-align: center; margin-top: 1.5rem; font-size: 0.85rem; }
        .links a { color: var(--text-muted); text-decoration: none; transition: color 0.2s; }
        .links a:hover { color: #fff; }

        .alert { padding: 1rem; border-radius: 8px; margin-bottom: 1.5rem; font-size: 0.9rem; border: 1px solid; text-align: center; }
        .alert-success { background: rgba(74, 222, 128, 0.1); border-color: rgba(74, 222, 128, 0.2); color: #4ade80; }
        .alert-danger { background: rgba(248, 113, 113, 0.1); border-color: rgba(248, 113, 113, 0.2); color: #f87171; }
        .alert-warning { background: rgba(250, 204, 21, 0.1); border-color: rgba(250, 204, 21, 0.2); color: #facc15; }
    </style>
</head>
<body>

    <div class="auth-wrapper">
        <div class="brand">EdenNexus</div>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autocomplete="off">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required autocomplete="off">
            </div>
            <button type="submit" class="btn">Sign In</button>
        </form>
        
        <div class="links">
            <a href="{{ url_for('signup') }}">Create an account</a>
        </div>
    </div>

</body>
</html>
