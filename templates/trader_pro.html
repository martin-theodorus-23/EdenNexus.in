<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Trader (Setup & Trade)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #1a1a1a; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #444; }
        
        .glass-panel {
            background: rgba(20, 20, 20, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="bg-[#050505] text-gray-300 h-screen overflow-hidden">
    <div id="root" class="h-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // --- ICONS ---
        const IconBase = ({ children, color = "currentColor", size = 24, className = "", ...props }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>{children}</svg>
        );

        const Terminal = (props) => <IconBase {...props}><polyline points="4 17 10 11" /><line x1="12" y1="19" x2="20" y2="19" /></IconBase>;
        const Wallet = (props) => <IconBase {...props}><path d="M21 12V7a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-5" /><path d="M16 12h5" /></IconBase>;
        const RefreshCw = (props) => <IconBase {...props}><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" /><path d="M21 3v5h-5" /><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" /><path d="M8 16H3v5" /></IconBase>;
        const AlertTriangle = (props) => <IconBase {...props}><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z" /><line x1="12" y1="9" x2="12" y2="13" /><line x1="12" y1="17" x2="12.01" y2="17" /></IconBase>;
        const ShieldCheck = (props) => <IconBase {...props}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" /><path d="m9 12 2 2 4-4" /></IconBase>;
        const Zap = (props) => <IconBase {...props}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" /></IconBase>;
        const Wifi = (props) => <IconBase {...props}><path d="M5 12.55a11 11 0 0 1 14.08 0" /><path d="M1.42 9a16 16 0 0 1 21.16 0" /><path d="M8.53 16.11a6 6 0 0 1 6.95 0" /><line x1="12" y1="20" x2="12.01" y2="20" /></IconBase>;
        const WifiOff = (props) => <IconBase {...props}><line x1="2" y1="2" x2="22" y2="22" /><path d="M8.53 16.11a6 6 0 0 1 6.95 0" /><line x1="12" y1="20" x2="12.01" y2="20" /></IconBase>;
        const Globe = (props) => <IconBase {...props}><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></IconBase>;
        const Sliders = (props) => <IconBase {...props}><line x1="4" y1="21" x2="4" y2="14" /><line x1="4" y1="10" x2="4" y2="3" /><line x1="12" y1="21" x2="12" y2="12" /><line x1="12" y1="8" x2="12" y2="3" /><line x1="20" y1="21" x2="20" y2="16" /><line x1="20" y1="12" x2="20" y2="3" /><line x1="1" y1="14" x2="7" y2="14" /><line x1="9" y1="8" x2="15" y2="8" /><line x1="17" y1="16" x2="23" y2="16" /></IconBase>;
        const Key = (props) => <IconBase {...props}><path d="m21 2-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0 3 3L22 7l-3-3m-3.5 3.5L19 4" /></IconBase>;
        const PlayCircle = (props) => <IconBase {...props}><circle cx="12" cy="12" r="10" /><polygon points="10 8 16 12 10 16 10 8" /></IconBase>;
        const TrendingDown = (props) => <IconBase {...props}><polyline points="23 18 13.5 8.5 8.5 13.5 1 6" /><polyline points="17 18 23 18 23 12" /></IconBase>;
        const MessageSquare = (props) => <IconBase {...props}><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" /></IconBase>;
        const Send = (props) => <IconBase {...props}><line x1="22" y1="2" x2="11" y2="13" /><polygon points="22 2 15 22 11 13 2 9 22 2" /></IconBase>;
        const List = (props) => <IconBase {...props}><line x1="8" y1="6" x2="21" y2="6" /><line x1="8" y1="12" x2="21" y2="12" /><line x1="8" y1="18" x2="21" y2="18" /><line x1="3" y1="6" x2="3.01" y2="6" /><line x1="3" y1="12" x2="3.01" y2="12" /><line x1="3" y1="18" x2="3.01" y2="18" /></IconBase>;
        const PieChart = (props) => <IconBase {...props}><path d="M21.21 15.89A10 10 0 1 1 8 2.83" /><path d="M22 12A10 10 0 0 0 12 2v10z" /></IconBase>;
        const Trash2 = (props) => <IconBase {...props}><polyline points="3 6 5 6 21 6" /><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" /></IconBase>;

        // --- CONFIGURATION ---
        const TICK_RATE_MS = 1000; 
        const HISTORY_LIMIT = 350; 
        const MIN_PROFIT_USD = 0.2; // Minimum Profit Constraint

        const STREAM_MAP = {
            "BTC-USD": "btcusdt",
            "ETH-USD": "ethusdt",
            "SOL-USD": "solusdt",
            "XRP-USD": "xrpusdt",
            "USDC-USD": "usdcusdt",
            "DOGE-USD": "dogeusdt",
            "PEPE-USD": "pepeusdt",
        };

        const INITIAL_STOCKS = [
            { symbol: "BTC-USD", name: "Bitcoin", type: "MAJOR", smaPeriod: 300, gridWidth: 0.002 },
            { symbol: "ETH-USD", name: "Ethereum", type: "MAJOR", smaPeriod: 300, gridWidth: 0.002 },
            { symbol: "SOL-USD", name: "Solana", type: "MAJOR", smaPeriod: 300, gridWidth: 0.002 },
            { symbol: "USDC-USD", name: "USDC", type: "STABLE", smaPeriod: 100, gridWidth: 0.002 }, 
            { symbol: "XRP-USD", name: "XRP", type: "STABLE", smaPeriod: 300, gridWidth: 0.002 },
            { symbol: "DOGE-USD", name: "Dogecoin", type: "VOLATILE", smaPeriod: 300, gridWidth: 0.002 },
            { symbol: "PEPE-USD", name: "Pepe", type: "VOLATILE", smaPeriod: 300, gridWidth: 0.002 },
        ];

        const formatPrice = (price) => {
            if (!price) return "0.00";
            if (price < 0.0001) return price.toFixed(8);
            if (price < 1) return price.toFixed(5);
            return price.toFixed(2);
        };

        const calculateStats = (priceHistory, currentPrice, period) => {
            const tempHistory = [...priceHistory, currentPrice];
            const effectivePeriod = Math.min(tempHistory.length, period);
            const slice = tempHistory.slice(-effectivePeriod);
            const sumLong = slice.reduce((a, b) => a + b, 0);
            const smaLong = sumLong / effectivePeriod;
            return { smaLong };
        };

        // --- COMPONENTS ---

        const SetupScreen = ({ onComplete }) => {
            const [mode, setMode] = useState('demo'); // 'demo' or 'real'
            const [demoAmount, setDemoAmount] = useState(50000);
            const [apiKey, setApiKey] = useState('');
            const [apiSecret, setApiSecret] = useState('');
            const [tgToken, setTgToken] = useState('');
            const [tgChatId, setTgChatId] = useState('');

            // Load saved config on mount
            useEffect(() => {
                try {
                    const saved = JSON.parse(localStorage.getItem('nexus_setup') || '{}');
                    if (saved.demoAmount) setDemoAmount(saved.demoAmount);
                    if (saved.apiKey) setApiKey(saved.apiKey);
                    if (saved.apiSecret) setApiSecret(saved.apiSecret);
                    if (saved.tgToken) setTgToken(saved.tgToken);
                    if (saved.tgChatId) setTgChatId(saved.tgChatId);
                } catch(e) { console.error("Error loading setup", e); }
            }, []);

            const handleStart = () => {
                if (mode === 'real' && (!apiKey || !apiSecret)) {
                    alert("Please enter both API Key and Secret for Real Trading mode.");
                    return;
                }

                // Save Config
                localStorage.setItem('nexus_setup', JSON.stringify({
                    demoAmount, apiKey, apiSecret, tgToken, tgChatId
                }));

                const config = {
                    mode,
                    cash: mode === 'demo' ? parseFloat(demoAmount) : 0, 
                    keys: mode === 'real' ? { apiKey, apiSecret } : null,
                    telegram: (tgToken && tgChatId) ? { token: tgToken, chatId: tgChatId } : null
                };
                onComplete(config);
            };

            return (
                <div className="flex items-center justify-center min-h-screen bg-gradient-to-br from-gray-900 to-black p-4">
                    <div className="glass-panel w-full max-w-md p-8 rounded-2xl shadow-2xl relative overflow-hidden">
                        <div className="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-purple-500 to-blue-500"></div>
                        
                        <div className="flex flex-col items-center mb-6">
                            <Globe className="text-purple-500 w-12 h-12 mb-4" />
                            <h1 className="text-3xl font-bold text-white tracking-tight">NEXUS TRADER</h1>
                            <p className="text-gray-500 text-sm mt-1">Select your trading environment</p>
                        </div>

                        {/* Mode Switcher */}
                        <div className="flex bg-gray-800 rounded-lg p-1 mb-6">
                            <button 
                                onClick={() => setMode('demo')}
                                className={`flex-1 py-2 text-sm font-bold rounded-md transition-all flex items-center justify-center gap-2 ${mode === 'demo' ? 'bg-gray-700 text-white shadow' : 'text-gray-500 hover:text-gray-300'}`}
                            >
                                <PlayCircle size={16} /> DEMO
                            </button>
                            <button 
                                onClick={() => setMode('real')}
                                className={`flex-1 py-2 text-sm font-bold rounded-md transition-all flex items-center justify-center gap-2 ${mode === 'real' ? 'bg-purple-900 text-purple-100 shadow' : 'text-gray-500 hover:text-gray-300'}`}
                            >
                                <Key size={16} /> REAL
                            </button>
                        </div>

                        {/* DEMO INPUTS */}
                        {mode === 'demo' && (
                            <div className="space-y-4 animate-in fade-in slide-in-from-bottom-4 duration-300 mb-6">
                                <div>
                                    <label className="block text-xs font-bold text-gray-500 uppercase mb-2">Initial Demo Balance (USD)</label>
                                    <div className="relative">
                                        <span className="absolute left-3 top-3 text-gray-400">$</span>
                                        <input 
                                            type="number" 
                                            value={demoAmount} 
                                            onChange={(e) => setDemoAmount(e.target.value)}
                                            className="w-full bg-gray-900 border border-gray-700 rounded-lg py-3 pl-8 pr-4 text-white focus:outline-none focus:border-purple-500 font-mono text-lg"
                                        />
                                    </div>
                                    <div className="flex gap-2 mt-2">
                                        {[1000, 10000, 100000].map(amt => (
                                            <button 
                                                key={amt}
                                                onClick={() => setDemoAmount(amt)}
                                                className="text-xs bg-gray-800 hover:bg-gray-700 px-2 py-1 rounded text-gray-400 hover:text-white transition-colors"
                                            >
                                                ${amt.toLocaleString()}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* REAL INPUTS */}
                        {mode === 'real' && (
                            <div className="space-y-4 animate-in fade-in slide-in-from-bottom-4 duration-300 mb-6">
                                <div className="p-3 bg-yellow-900/20 border border-yellow-900/50 rounded text-xs text-yellow-500 mb-4">
                                    <div className="font-bold flex items-center gap-2 mb-1"><AlertTriangle size={12} /> SECURITY WARNING</div>
                                    Browser security (CORS) prevents direct trading from this file. API keys are stored in local memory only. Use a local proxy or the Node.js version for execution.
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-gray-500 uppercase mb-2">Binance API Key</label>
                                    <input 
                                        type="text" 
                                        value={apiKey} 
                                        onChange={(e) => setApiKey(e.target.value)}
                                        placeholder="Enter Public Key"
                                        className="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:border-purple-500 font-mono text-xs"
                                    />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-gray-500 uppercase mb-2">Binance API Secret</label>
                                    <input 
                                        type="password" 
                                        value={apiSecret} 
                                        onChange={(e) => setApiSecret(e.target.value)}
                                        placeholder="Enter Secret Key"
                                        className="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:border-purple-500 font-mono text-xs"
                                    />
                                </div>
                            </div>
                        )}

                        {/* TELEGRAM SETTINGS (OPTIONAL) */}
                        <div className="pt-4 border-t border-gray-800 space-y-4">
                            <div className="text-[10px] font-bold text-blue-400 uppercase flex items-center gap-2">
                                <MessageSquare size={12} /> Telegram Notifications (Optional)
                            </div>
                            <div className="grid grid-cols-2 gap-2">
                                <div>
                                    <input 
                                        type="text" 
                                        value={tgToken} 
                                        onChange={(e) => setTgToken(e.target.value)}
                                        placeholder="Bot Token"
                                        className="w-full bg-gray-900 border border-gray-700 rounded-lg p-2 text-white focus:outline-none focus:border-blue-500 font-mono text-xs"
                                    />
                                </div>
                                <div>
                                    <input 
                                        type="text" 
                                        value={tgChatId} 
                                        onChange={(e) => setTgChatId(e.target.value)}
                                        placeholder="Chat ID"
                                        className="w-full bg-gray-900 border border-gray-700 rounded-lg p-2 text-white focus:outline-none focus:border-blue-500 font-mono text-xs"
                                    />
                                </div>
                            </div>
                            <div className="text-[9px] text-gray-600">
                                Create bot via @BotFather. Get ID via @userinfobot.
                            </div>
                        </div>

                        <button 
                            onClick={handleStart}
                            className="w-full mt-8 bg-gradient-to-r from-purple-600 to-blue-600 hover:from-purple-500 hover:to-blue-500 text-white font-bold py-4 rounded-lg shadow-lg transform transition hover:scale-[1.02] active:scale-[0.98]"
                        >
                            LAUNCH {mode === 'demo' ? 'SIMULATION' : 'REAL TRADING'}
                        </button>
                    </div>
                </div>
            );
        };

        const StockChart = ({ data, gridWidth, smaPeriod, entryPrice, stopLossPct, height = 300 }) => {
            if (!data || data.length < 2) return <div className="h-full flex flex-col items-center justify-center text-gray-700 text-xs animate-pulse">Building Grid Anchor...</div>;

            const width = 600; 
            const padding = 20;

            const allValues = data.flatMap(d => [d.price, d.smaLong * (1 + gridWidth), d.smaLong * (1 - gridWidth)].filter(v => v > 0));
            if (entryPrice) {
                const stopPrice = entryPrice * (1 - stopLossPct);
                allValues.push(stopPrice);
            }
            
            let minVal = Math.min(...allValues);
            let maxVal = Math.max(...allValues);
            let range = maxVal - minVal;
            
            if (range === 0) {
                const tinyBuffer = (minVal * 0.0001) || 0.001;
                minVal -= tinyBuffer;
                maxVal += tinyBuffer;
                range = maxVal - minVal;
            }

            const getX = (index) => padding + (index / (HISTORY_LIMIT - 1)) * (width - 2 * padding);
            const getY = (val) => height - padding - ((val - minVal) / range) * (height - 2 * padding);

            const makePath = (keyOrFn, color, width = 2, dash = "") => {
                const points = data.map((d, i) => {
                    const val = typeof keyOrFn === 'function' ? keyOrFn(d) : d[keyOrFn];
                    return `${getX(i)},${getY(val)}`;
                }).join(" ");
                return <polyline points={points} fill="none" stroke={color} strokeWidth={width} strokeDasharray={dash} strokeLinecap="round" strokeLinejoin="round" vectorEffect="non-scaling-stroke" />;
            };

            return (
                <div className="relative w-full h-full bg-[#111] rounded-xl border border-gray-800 overflow-hidden shadow-inner select-none">
                <svg viewBox={`0 0 ${width} ${height}`} className="w-full h-full preserve-3d">
                    <line x1={0} y1={getY(minVal + range * 0.25)} x2={width} y2={getY(minVal + range * 0.25)} stroke="#222" strokeDasharray="4" />
                    <line x1={0} y1={getY(minVal + range * 0.5)} x2={width} y2={getY(minVal + range * 0.5)} stroke="#222" strokeDasharray="4" />
                    <line x1={0} y1={getY(minVal + range * 0.75)} x2={width} y2={getY(minVal + range * 0.75)} stroke="#222" strokeDasharray="4" />

                    {makePath('smaLong', '#eab308', 2)} 
                    {makePath(d => d.smaLong * (1 + gridWidth), '#a855f7', 1, "4,4")} 
                    {makePath(d => d.smaLong * (1 - gridWidth), '#f97316', 1, "4,4")} 
                    
                    {entryPrice && (
                        <g>
                            <line 
                                x1={0} 
                                y1={getY(entryPrice * (1 - stopLossPct))} 
                                x2={width} 
                                y2={getY(entryPrice * (1 - stopLossPct))} 
                                stroke="#ef4444" 
                                strokeWidth="2" 
                                strokeDasharray="6,4" 
                            />
                            <text x={10} y={getY(entryPrice * (1 - stopLossPct)) - 5} fill="#ef4444" fontSize="10" fontWeight="bold">STOP LOSS</text>
                        </g>
                    )}

                    {makePath('price', '#fff', 3)}       

                    {data.map((d, i) => {
                        if (!d.action) return null;
                        return (
                            <g key={i}>
                                <circle cx={getX(i)} cy={getY(d.price)} r="4" fill={d.action === 'buy' ? "#22c55e" : "#ef4444"} stroke="#fff" strokeWidth="1" />
                            </g>
                        );
                    })}
                </svg>

                <div className="absolute top-4 left-4 flex flex-col gap-2 bg-black/60 p-2 rounded backdrop-blur-sm text-xs font-mono border border-white/10">
                    <div className="flex items-center gap-2"><div className="w-3 h-1 bg-white"></div> PRICE</div>
                    <div className="flex items-center gap-2"><div className="w-3 h-1 bg-yellow-500"></div> ANCHOR (SMA{smaPeriod})</div>
                    <div className="flex items-center gap-2"><div className="w-3 h-1 bg-purple-500 border border-purple-500 border-dashed"></div> SELL (+{(gridWidth*100).toFixed(2)}%)</div>
                    <div className="flex items-center gap-2"><div className="w-3 h-1 bg-orange-500 border border-orange-500 border-dashed"></div> BUY (-{(gridWidth*100).toFixed(2)}%)</div>
                    {entryPrice && <div className="flex items-center gap-2"><div className="w-3 h-1 bg-red-500 border border-red-500 border-dashed"></div> STOP LOSS (-{(stopLossPct * 100).toFixed(1)}%)</div>}
                </div>
                </div>
            );
        };

        const BotBrain = ({ stock, isAuto }) => {
            if (!stock.price || stock.price === 0) return <div className="p-4 text-xs text-gray-600">Initializing Intelligence...</div>;

            let status = "WAITING";
            let statusColor = "text-gray-500";
            let signalStrength = 0;
            let isBullish = true;

            const gridWidth = stock.gridWidth;
            const center = stock.smaLong;
            const diff = stock.price - center; 
            const percentDiff = (diff / center); 
            
            isBullish = diff < 0; 
            const rawProgress = Math.abs(percentDiff) / gridWidth;
            signalStrength = Math.min(100, rawProgress * 100);

            if (percentDiff < -gridWidth) {
                status = "BUY TRIGGERED";
                statusColor = "text-green-500 animate-pulse";
            } else if (percentDiff > gridWidth) {
                status = "SELL TRIGGERED";
                statusColor = "text-purple-500 animate-pulse";
            } else {
                status = `GAP: ${(Math.abs(percentDiff)*100).toFixed(3)}%`;
            }

            return (
                <div className="bg-[#1a1a1a] rounded-lg border border-gray-800 p-4 flex flex-col gap-3">
                <div className="flex items-center gap-2 text-sm text-gray-400 font-bold border-b border-gray-800 pb-2">
                    <Zap size={14} className={isAuto ? "text-purple-500 animate-pulse" : "text-gray-600"} />
                    DECISION ENGINE
                </div>
                
                <div className="space-y-1">
                    <div className="flex justify-between text-xs">
                        <span className="text-gray-500">TRIGGER PROXIMITY</span>
                        <span className={isBullish ? "text-green-400" : "text-purple-400"}>{signalStrength.toFixed(1)}%</span>
                    </div>
                    <div className="h-3 bg-gray-800 rounded-full overflow-hidden flex relative">
                        <div className="absolute left-[50%] top-0 bottom-0 w-[1px] bg-gray-600"></div>
                        <div className={`h-full transition-all duration-300 ${isBullish ? "bg-green-600" : "bg-purple-600"}`} 
                             style={{ width: `${signalStrength}%` }}></div>
                    </div>
                    <div className="flex justify-between text-[9px] text-gray-600">
                        <span>CENTER</span>
                        <span>TARGET: {(gridWidth*100).toFixed(2)}%</span>
                    </div>
                </div>

                <div className="bg-black/40 p-2 rounded border border-gray-800 text-center">
                    <div className="text-[10px] text-gray-600 mb-1">STATUS</div>
                    <div className={`text-xs font-bold font-mono tracking-wide ${statusColor}`}>{status}</div>
                </div>
                </div>
            );
        };

        const App = () => {
            const [setupComplete, setSetupComplete] = useState(false);
            const [appConfig, setAppConfig] = useState(null);

            // STATE LOADING (Lazy Init)
            const [cash, setCash] = useState(0);
            const [realizedPnL, setRealizedPnL] = useState(() => parseFloat(localStorage.getItem('nexus_pnl') || '0'));
            const [isConnected, setIsConnected] = useState(false);
            
            const [tradeSizePercent, setTradeSizePercent] = useState(() => parseFloat(localStorage.getItem('nexus_trade_size') || '0.1')); 
            const [feeRate, setFeeRate] = useState(() => parseFloat(localStorage.getItem('nexus_fee_rate') || '0.0'));
            const [stopLossPct, setStopLossPct] = useState(() => parseFloat(localStorage.getItem('nexus_stop_loss') || '0.01'));

            const [stocks, setStocks] = useState(() => {
                const savedConfig = JSON.parse(localStorage.getItem('nexus_stocks_config') || '{}');
                return INITIAL_STOCKS.map(s => {
                    const saved = savedConfig[s.symbol] || {};
                    return {
                        ...s,
                        gridWidth: saved.gridWidth || s.gridWidth,
                        smaPeriod: saved.smaPeriod || s.smaPeriod,
                        price: 0, trendBias: 0, history: [], smaLong: 0
                    };
                });
            });

            const [portfolio, setPortfolio] = useState(() => JSON.parse(localStorage.getItem('nexus_portfolio') || '{}'));
            const [entryPrices, setEntryPrices] = useState(() => JSON.parse(localStorage.getItem('nexus_entry_prices') || '{}'));

            const [selectedSymbol, setSelectedSymbol] = useState("BTC-USD");
            const [isAutoTrading, setIsAutoTrading] = useState(false);
            const [logs, setLogs] = useState([]);
            const logsEndRef = useRef(null);

            const portfolioRef = useRef(portfolio);
            const entryPricesRef = useRef(entryPrices);
            const cashRef = useRef(cash);
            const isAutoTradingRef = useRef(isAutoTrading);
            const tradeSizeRef = useRef(tradeSizePercent);
            const feeRateRef = useRef(feeRate);
            const stopLossRef = useRef(stopLossPct);
            const realizedPnLRef = useRef(realizedPnL);
            const latestPricesRef = useRef({}); 
            const wsRef = useRef(null);
            const reconnectTimeoutRef = useRef(null);

            // Sync refs & PERSISTENCE
            useEffect(() => { 
                portfolioRef.current = portfolio; 
                localStorage.setItem('nexus_portfolio', JSON.stringify(portfolio));
            }, [portfolio]);
            
            useEffect(() => { 
                entryPricesRef.current = entryPrices; 
                localStorage.setItem('nexus_entry_prices', JSON.stringify(entryPrices));
            }, [entryPrices]);
            
            useEffect(() => { 
                cashRef.current = cash; 
                // Only save cash if setup is complete (prevent overwriting with 0 on init)
                if(setupComplete) localStorage.setItem('nexus_cash', cash.toString());
            }, [cash, setupComplete]);
            
            useEffect(() => { isAutoTradingRef.current = isAutoTrading; }, [isAutoTrading]);
            
            useEffect(() => { 
                tradeSizeRef.current = tradeSizePercent; 
                localStorage.setItem('nexus_trade_size', tradeSizePercent.toString());
            }, [tradeSizePercent]);
            
            useEffect(() => { 
                feeRateRef.current = feeRate; 
                localStorage.setItem('nexus_fee_rate', feeRate.toString());
            }, [feeRate]);
            
            useEffect(() => { 
                stopLossRef.current = stopLossPct; 
                localStorage.setItem('nexus_stop_loss', stopLossPct.toString());
            }, [stopLossPct]);
            
            useEffect(() => { 
                realizedPnLRef.current = realizedPnL; 
                localStorage.setItem('nexus_pnl', realizedPnL.toString());
            }, [realizedPnL]);

            useEffect(() => {
                logsEndRef.current?.scrollIntoView({ behavior: "smooth" });
            }, [logs]);

            // Handle Setup Completion
            const handleSetupComplete = (config) => {
                setAppConfig(config);
                
                // CHECK FOR SAVED SESSION
                const savedCash = localStorage.getItem('nexus_cash');
                if (savedCash) {
                    setCash(parseFloat(savedCash));
                    addLog("Resumed previous session balance & portfolio.", "system");
                } else {
                    setCash(config.cash);
                }

                setSetupComplete(true);
                addLog(`System Initialized in ${config.mode.toUpperCase()} mode.`, "system");
                if (config.mode === 'real') {
                    addLog("Warning: Real Execution mode active. Keys loaded in memory.", "system");
                }
                if (config.telegram) {
                    addLog("Telegram Notifications Active.", "system");
                    sendTelegram(config.telegram.token, config.telegram.chatId, `🚀 *NEXUS TRADER SYSTEM ONLINE*\nMode: ${config.mode.toUpperCase()}\nInitial Balance: $${config.cash}`);
                }
            };

            const resetData = () => {
                if(!confirm("Are you sure you want to reset all trading data? Strategy settings and keys will remain.")) return;
                
                localStorage.removeItem('nexus_cash');
                localStorage.removeItem('nexus_portfolio');
                localStorage.removeItem('nexus_entry_prices');
                localStorage.removeItem('nexus_pnl');
                
                setCash(appConfig.cash); // Reset to initial config amount
                setPortfolio({});
                setEntryPrices({});
                setRealizedPnL(0);
                addLog("System Data Reset to defaults.", "system");
            };

            const addLog = (msg, type = "info") => {
                const time = new Date().toLocaleTimeString('en-US', { hour12: false });
                const prefix = type === "auto" ? "[BOT]" : type === "system" ? "[SYS]" : "[MAN]";
                setLogs(prev => [`${prefix} ${time}: ${msg}`, ...prev].slice(0, 50));
            };

            const sendTelegram = async (token, chatId, message) => {
                const url = `https://api.telegram.org/bot${token}/sendMessage`;
                try {
                    await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            chat_id: chatId, 
                            text: message, 
                            parse_mode: 'Markdown' 
                        })
                    });
                } catch (e) {
                    console.error("Telegram send failed", e);
                    addLog("Telegram API Error (Check CORS/Token)", "system");
                }
            };

            const handleTelegramCommand = (cmd) => {
                if (!appConfig?.telegram) {
                    alert("Telegram is not configured. Please reload and set up your bot keys.");
                    return;
                }
                
                const { token, chatId } = appConfig.telegram;
                
                if (cmd === 'status') {
                    const netWorth = getNetWorth();
                    const pnl = realizedPnLRef.current;
                    const activePositions = Object.keys(portfolioRef.current).length;
                    const msg = `📊 *LIVE STATUS REPORT*\n` +
                                `----------------\n` +
                                `🤖 *Bot State:* ${isAutoTradingRef.current ? "ACTIVE 🟢" : "PAUSED 🔴"}\n` +
                                `💰 *Net Worth:* $${netWorth.toFixed(2)}\n` +
                                `💵 *Cash on Hand:* $${cashRef.current.toFixed(2)}\n` +
                                `📈 *Realized PnL:* $${pnl.toFixed(2)}\n` +
                                `🎒 *Active Positions:* ${activePositions}`;
                    sendTelegram(token, chatId, msg);
                    addLog("CMD: Sent Status Report", "system");
                }
                
                if (cmd === 'wallet') {
                     const portfolio = portfolioRef.current;
                     let positionsMsg = "";
                     Object.entries(portfolio).forEach(([sym, qty]) => {
                         const stock = stocks.find(s => s.symbol === sym);
                         const val = stock.price * qty;
                         positionsMsg += `• ${sym}: ${qty.toFixed(4)} ($${val.toFixed(2)})\n`;
                     });

                     if (!positionsMsg) positionsMsg = "No active assets.";

                     const msg = `💼 *WALLET BREAKDOWN*\n` +
                                 `----------------\n` +
                                 `💵 *Cash:* $${cashRef.current.toFixed(2)}\n` +
                                 `\n*Assets:*\n${positionsMsg}`;
                    sendTelegram(token, chatId, msg);
                    addLog("CMD: Sent Wallet Report", "system");
                }

                if (cmd === 'prices') {
                    const stockList = stocks.map(s => 
                        `• ${s.symbol.padEnd(8)} $${formatPrice(s.price)}`
                    ).join('\n');
                    const msg = `💹 *MARKET SNAPSHOT*\n` +
                                `----------------\n` +
                                `${stockList}`;
                    sendTelegram(token, chatId, msg);
                    addLog("CMD: Sent Price Update", "system");
                }
            };

            const updateStockSetting = (symbol, field, value) => {
                setStocks(prev => {
                    const newStocks = prev.map(s => 
                        s.symbol === symbol ? { ...s, [field]: value } : s
                    );
                    
                    // SAVE CONFIG TO LOCAL STORAGE
                    const configToSave = {};
                    newStocks.forEach(s => {
                        configToSave[s.symbol] = { gridWidth: s.gridWidth, smaPeriod: s.smaPeriod };
                    });
                    localStorage.setItem('nexus_stocks_config', JSON.stringify(configToSave));
                    
                    return newStocks;
                });
            };

            const connectWebSocket = useCallback(() => {
                // Clear existing connection if any
                if (wsRef.current) {
                    wsRef.current.close();
                }
                if (reconnectTimeoutRef.current) {
                    clearTimeout(reconnectTimeoutRef.current);
                }

                const cryptoStocks = INITIAL_STOCKS.filter(s => STREAM_MAP[s.symbol]);
                const streams = cryptoStocks.map(s => `${STREAM_MAP[s.symbol]}@trade`).join('/');
                const ws = new WebSocket(`wss://stream.binance.com:9443/ws/${streams}`);
                
                wsRef.current = ws;

                ws.onopen = () => {
                    setIsConnected(true);
                    addLog("Binance Feed Connected", "system");
                };

                ws.onmessage = (event) => {
                    const message = JSON.parse(event.data);
                    const symbolKey = Object.keys(STREAM_MAP).find(key => STREAM_MAP[key].toUpperCase() === message.s);
                    if (symbolKey) latestPricesRef.current[symbolKey] = parseFloat(message.p);
                };

                ws.onclose = () => {
                    setIsConnected(false);
                    // Prevent log spam if it's a hot reload close
                    if (!setupComplete) return;
                    
                    addLog("Feed Disconnected. Auto-Reconnecting in 3s...", "system");
                    // Attempt Reconnect
                    reconnectTimeoutRef.current = setTimeout(() => {
                        addLog("Attempting Reconnection...", "system");
                        connectWebSocket();
                    }, 3000);
                };

                ws.onerror = (err) => {
                    console.error("WS Error", err);
                    ws.close();
                };
            }, [setupComplete]);

            useEffect(() => {
                if (!setupComplete) return;

                connectWebSocket();

                const interval = setInterval(() => {
                    setStocks(currentStocks => {
                    return currentStocks.map(stock => {
                        let currentPrice = stock.price;

                        if (STREAM_MAP[stock.symbol]) {
                            // If we have a fresh price, use it. If disconnected, this might stay stale.
                            // To strictly show flatline only when truly stagnant:
                            currentPrice = latestPricesRef.current[stock.symbol] || stock.price;
                        } 

                        if (!currentPrice || currentPrice === 0) return stock;

                        const priceHistory = stock.history.map(h => h.price);
                        const { smaLong } = calculateStats(priceHistory, currentPrice, stock.smaPeriod);

                        const newPoint = { 
                            price: currentPrice, 
                            smaLong, 
                            action: null 
                        };

                        let newHistory;
                        if (stock.history.length === 0) {
                            newHistory = Array(HISTORY_LIMIT).fill(newPoint);
                        } else {
                            newHistory = [...stock.history, newPoint].slice(-HISTORY_LIMIT);
                        }

                        const updatedStock = {
                            ...stock,
                            price: currentPrice,
                            history: newHistory,
                            smaLong
                        };

                        if (isAutoTradingRef.current) {
                            runGridLogic(updatedStock);
                        }

                        return updatedStock;
                    });
                    });
                }, TICK_RATE_MS);

                return () => {
                    clearInterval(interval);
                    if (wsRef.current) wsRef.current.close();
                    if (reconnectTimeoutRef.current) clearTimeout(reconnectTimeoutRef.current);
                };
            }, [setupComplete, connectWebSocket]);

            const runGridLogic = (stock) => {
                if (stock.smaLong === 0) return;

                const portfolio = portfolioRef.current;
                const hasPos = portfolio[stock.symbol] > 0;
                
                // --- STOP LOSS LOGIC ---
                const entryPrice = entryPricesRef.current[stock.symbol];
                if (hasPos && entryPrice) {
                    const stopPrice = entryPrice * (1 - stopLossRef.current);
                    if (stock.price < stopPrice) {
                        sellStock(stock, "stop-loss");
                        return; 
                    }
                }
                
                // --- GRID LOGIC ---
                const gridWidth = stock.gridWidth; 
                const center = stock.smaLong;
                const lowerBand = center * (1 - gridWidth);
                const upperBand = center * (1 + gridWidth);

                if (stock.price < lowerBand && !hasPos) {
                    buyStock(stock); 
                } 
                else if (hasPos && stock.price > upperBand) {
                    sellStock(stock);
                }
            };

            const buyStock = (stock) => {
                const cashPercent = tradeSizeRef.current;
                if(cashRef.current < 1 && appConfig?.mode === 'demo') return; 
                const investAmount = cashRef.current * cashPercent;
                const qty = investAmount / stock.price;
                executeTrade(stock, qty, "buy", true);
            };

            const sellStock = (stock, reason = "standard") => {
                const qty = portfolioRef.current[stock.symbol];
                executeTrade(stock, qty, "sell", true, reason);
            };

            const executeTrade = (stock, qty, type, isAuto = false, reason = "standard") => {
                if (stock.price === 0) return;
                const grossAmount = stock.price * qty;

                // ENFORCE MINIMUM ORDER VALUE ($1)
                if (grossAmount < 1) return;

                const fee = grossAmount * feeRateRef.current;

                if (type === "buy") {
                    if (cashRef.current < grossAmount) return;
                    
                    // Update Average Entry Price
                    setEntryPrices(prev => {
                        const oldQty = portfolioRef.current[stock.symbol] || 0;
                        const oldAvg = prev[stock.symbol] || 0;
                        // Avoid NaN if first buy
                        const newTotalQty = oldQty + qty;
                        const newAvg = ((oldQty * oldAvg) + (qty * stock.price)) / newTotalQty;
                        return { ...prev, [stock.symbol]: newAvg };
                    });

                    setCash(prev => prev - grossAmount - fee);
                    setPortfolio(prev => ({ ...prev, [stock.symbol]: (prev[stock.symbol] || 0) + qty }));
                    addLog(`BOUGHT ${qty.toFixed(4)} ${stock.symbol} @ $${formatPrice(stock.price)} (Fee: $${fee.toFixed(2)})`, isAuto ? "auto" : "manual");
                    markChart(stock.symbol, 'buy');

                    // Telegram Notify
                    if (appConfig?.telegram) {
                        const msg = `🟢 *BUY ALERT*\n` +
                                    `*Symbol:* ${stock.symbol}\n` +
                                    `*Price:* $${formatPrice(stock.price)}\n` +
                                    `*Qty:* ${qty.toFixed(4)}\n` +
                                    `*Value:* $${grossAmount.toFixed(2)}`;
                        sendTelegram(appConfig.telegram.token, appConfig.telegram.chatId, msg);
                    }

                } else {
                    const currentQty = portfolioRef.current[stock.symbol] || 0;
                    if (currentQty < qty) return;
                    
                    // --- MINIMUM PROFIT CHECK (For Standard Sells Only) ---
                    let tradePnL = 0;
                    const entryPrice = entryPricesRef.current[stock.symbol];
                    if (entryPrice) {
                        const cost = entryPrice * qty;
                        tradePnL = (grossAmount - fee) - cost;
                        
                        if (reason === 'standard') {
                            if (tradePnL < MIN_PROFIT_USD) {
                                return; // Profit too small
                            }
                        }
                    }

                    const proceeds = grossAmount - fee;
                    setCash(prev => prev + proceeds);
                    setRealizedPnL(prev => prev + tradePnL); // Update lifetime PnL
                    
                    setPortfolio(prev => {
                        const newPort = { ...prev, [stock.symbol]: prev[stock.symbol] - qty };
                        if (newPort[stock.symbol] <= 0.000001) {
                            delete newPort[stock.symbol];
                            // Clean up entry price if fully sold
                            setEntryPrices(curr => {
                                const newEntries = { ...curr };
                                delete newEntries[stock.symbol];
                                return newEntries;
                            });
                        }
                        return newPort;
                    });
                    
                    const logPrefix = reason === "stop-loss" ? "STOP LOSS: " : "";
                    addLog(`${logPrefix}SOLD ${qty.toFixed(4)} ${stock.symbol} @ $${formatPrice(stock.price)} (Fee: $${fee.toFixed(2)})`, isAuto ? "auto" : "manual");
                    markChart(stock.symbol, 'sell');

                     // Telegram Notify
                     if (appConfig?.telegram) {
                        const icon = reason === "stop-loss" ? "🛑" : "🟣";
                        const title = reason === "stop-loss" ? "STOP LOSS TRIGGERED" : "SELL ALERT";
                        const newTotalPnL = realizedPnLRef.current + tradePnL;
                        
                        const msg = `${icon} *${title}*\n` +
                                    `*Symbol:* ${stock.symbol}\n` +
                                    `*Price:* $${formatPrice(stock.price)}\n` +
                                    `*Qty:* ${qty.toFixed(4)}\n` +
                                    `------------------\n` +
                                    `💰 *Trade PnL:* ${tradePnL >= 0 ? '+' : ''}$${tradePnL.toFixed(2)}\n` +
                                    `📉 *Total Realized PnL:* ${newTotalPnL >= 0 ? '+' : ''}$${newTotalPnL.toFixed(2)}`;
                        sendTelegram(appConfig.telegram.token, appConfig.telegram.chatId, msg);
                    }
                }
            };

            const markChart = (symbol, action) => {
                setStocks(prevStocks => prevStocks.map(s => {
                    if (s.symbol !== symbol || s.history.length === 0) return s;
                    const newHistory = [...s.history];
                    const lastIdx = newHistory.length - 1;
                    newHistory[lastIdx] = { ...newHistory[lastIdx], action: action };
                    return { ...s, history: newHistory };
                }));
            };

            const selectedStockData = stocks.find(s => s.symbol === selectedSymbol);
            const getNetWorth = () => {
                let stockValue = 0;
                stocks.forEach(s => {
                    if (portfolio[s.symbol]) {
                    stockValue += s.price * portfolio[s.symbol];
                    }
                });
                return cash + stockValue;
            };

            if (!setupComplete) {
                return <SetupScreen onComplete={handleSetupComplete} />;
            }

            return (
                <div className="flex flex-col h-screen bg-[#0d0d0d] text-gray-300 font-mono overflow-hidden selection:bg-purple-900 selection:text-white">
                
                {/* HEADER */}
                <header className="flex items-center justify-between px-6 py-3 bg-[#161616] border-b border-gray-800 shadow-md z-10">
                    <div className="flex items-center gap-4">
                    <div className="flex items-center gap-2">
                        <Globe className="text-purple-500" />
                        <h1 className="text-xl font-bold tracking-wider text-gray-100">NEXUS <span className="text-purple-500">PRO</span></h1>
                    </div>
                    <div className={`flex items-center gap-1 text-[10px] px-2 py-1 rounded border ${isConnected ? "border-green-900 bg-green-900/20 text-green-400" : "border-red-900 bg-red-900/20 text-red-400"}`}>
                        {isConnected ? <Wifi size={12} /> : <WifiOff size={12} />}
                        {isConnected ? "LIVE FEED" : "OFFLINE"}
                    </div>
                    {appConfig?.mode === 'real' && (
                        <div className="flex items-center gap-1 text-[10px] px-2 py-1 rounded border border-yellow-900 bg-yellow-900/20 text-yellow-500 animate-pulse">
                            <Key size={12} /> REAL MODE
                        </div>
                    )}
                    </div>
                    <div className="flex gap-6 text-sm">
                    <div className="flex flex-col items-end">
                        <span className="text-gray-500 text-[10px] tracking-widest uppercase">Net Worth</span>
                        <span className="text-cyan-400 font-bold text-lg">${getNetWorth().toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}</span>
                    </div>
                    <div className="flex flex-col items-end">
                        <span className="text-gray-500 text-[10px] tracking-widest uppercase">Cash</span>
                        <span className="text-green-500 font-bold text-lg">${cash.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}</span>
                    </div>
                    </div>
                </header>

                <div className="flex flex-1 overflow-hidden">
                    
                    {/* MARKET WATCH */}
                    <aside className="w-1/4 min-w-[280px] bg-[#111] border-r border-gray-800 flex flex-col">
                    <div className="p-3 bg-[#1a1a1a] border-b border-gray-800 text-xs font-bold text-gray-500 flex justify-between">
                        <span>ASSETS</span>
                        <span>PRICE</span>
                    </div>
                    <div className="overflow-y-auto flex-1">
                        {stocks.map(stock => {
                        return (
                            <div 
                            key={stock.symbol}
                            onClick={() => setSelectedSymbol(stock.symbol)}
                            className={`p-4 border-b border-gray-800 cursor-pointer hover:bg-[#1a1a1a] transition-colors ${selectedSymbol === stock.symbol ? 'bg-[#1e293b] border-l-4 border-l-purple-500' : ''}`}
                            >
                            <div className="flex justify-between items-center mb-1">
                                <span className="font-bold text-white text-sm">{stock.name}</span>
                                <div className="flex flex-col items-end">
                                    <span className={`transition-colors duration-300 font-mono ${stock.trendBias > 0 ? "text-green-500" : "text-red-500"}`}>
                                        {stock.price > 0 ? `$${formatPrice(stock.price)}` : "..."}
                                    </span>
                                    <span className="text-[9px] text-gray-500">Grid: {(stock.gridWidth * 100).toFixed(2)}%</span>
                                </div>
                            </div>
                            </div>
                        );
                        })}
                    </div>
                    </aside>

                    {/* TRADING TERMINAL */}
                    <main className="flex-1 flex flex-col bg-[#0d0d0d] relative">
                    <div className="flex-1 p-6 flex flex-col gap-4 overflow-hidden">
                        
                        {/* Asset Header */}
                        <div className="flex justify-between items-end mb-2">
                        <div>
                            <h2 className="text-2xl text-gray-500 flex items-center gap-3">
                                {selectedStockData.name} 
                                <span className="text-[10px] px-2 py-0.5 rounded border border-purple-800 text-purple-500 bg-purple-900/20">
                                    CUSTOM GRID
                                </span>
                            </h2>
                            <div className={`text-4xl font-bold tracking-tighter ${selectedStockData.trendBias > 0 ? "text-green-500" : "text-red-500"}`}>
                                {selectedStockData.price > 0 ? `$${formatPrice(selectedStockData.price)}` : "..."}
                            </div>
                        </div>
                        <div className="flex items-center gap-6 bg-[#111] p-3 rounded-lg border border-gray-800">
                            <div className="text-right">
                                <div className="text-[10px] text-gray-500 uppercase tracking-wider">ANCHOR (SMA{selectedStockData.smaPeriod})</div>
                                <div className="text-yellow-400 font-mono text-xl">${formatPrice(selectedStockData.smaLong)}</div>
                            </div>
                        </div>
                        </div>

                        {/* Charts & Controls */}
                        <div className="flex-1 flex gap-4 min-h-0">
                        <div className="flex-1 min-h-0">
                            <StockChart 
                                data={selectedStockData.history} 
                                gridWidth={selectedStockData.gridWidth} 
                                smaPeriod={selectedStockData.smaPeriod} 
                                entryPrice={entryPrices[selectedSymbol]}
                                stopLossPct={stopLossPct}
                            />
                        </div>
                        
                        <div className="w-80 flex flex-col gap-4">
                            <BotBrain stock={selectedStockData} isAuto={isAutoTrading} />
                            
                            {/* STRATEGY CONFIG PANEL */}
                            <div className="bg-[#151515] p-4 rounded-xl border border-gray-800 flex flex-col gap-4 shadow-lg overflow-y-auto h-full">
                                <div className="flex items-center gap-2 text-sm font-bold text-gray-300 pb-2 border-b border-gray-800">
                                    <Sliders size={16} /> STRATEGY SETTINGS
                                </div>

                                {/* Asset Specific Settings */}
                                <div className="space-y-3">
                                    <div className="text-[10px] font-bold text-gray-500 uppercase">Per-Asset: {selectedStockData.symbol}</div>
                                    
                                    <div>
                                        <div className="flex justify-between text-xs mb-1">
                                            <span>Grid Width (Profit Ratio)</span>
                                            <span className="text-purple-400">{(selectedStockData.gridWidth * 100).toFixed(4)}%</span>
                                        </div>
                                        <input 
                                            type="number" step="0.0001" 
                                            value={selectedStockData.gridWidth}
                                            onChange={(e) => updateStockSetting(selectedStockData.symbol, 'gridWidth', parseFloat(e.target.value))}
                                            className="w-full bg-[#0a0a0a] border border-gray-800 rounded px-2 py-1 text-xs text-right text-gray-300 focus:border-purple-500 outline-none transition-colors"
                                        />
                                    </div>

                                    <div>
                                        <div className="flex justify-between text-xs mb-1">
                                            <span>Anchor Period (SMA)</span>
                                            <span className="text-yellow-400">{selectedStockData.smaPeriod}s</span>
                                        </div>
                                        <input 
                                            type="number" step="1" 
                                            value={selectedStockData.smaPeriod}
                                            onChange={(e) => updateStockSetting(selectedStockData.symbol, 'smaPeriod', parseInt(e.target.value))}
                                            className="w-full bg-[#0a0a0a] border border-gray-800 rounded px-2 py-1 text-xs text-right text-gray-300 focus:border-yellow-500 outline-none transition-colors"
                                        />
                                    </div>
                                </div>

                                {/* Global Settings */}
                                <div className="space-y-3 pt-2 border-t border-gray-800">
                                    <div className="text-[10px] font-bold text-gray-500 uppercase">Global Wallet Settings</div>
                                    
                                    <div>
                                        <div className="flex justify-between text-xs mb-1">
                                            <span>Trade Size (Ratio)</span>
                                            <span className="text-green-400">{(tradeSizePercent * 100).toFixed(0)}%</span>
                                        </div>
                                        <input 
                                            type="number" step="0.01" max="1" min="0"
                                            value={tradeSizePercent}
                                            onChange={(e) => setTradeSizePercent(parseFloat(e.target.value))}
                                            className="w-full bg-[#0a0a0a] border border-gray-800 rounded px-2 py-1 text-xs text-right text-gray-300 focus:border-green-500 outline-none transition-colors"
                                        />
                                    </div>

                                    <div>
                                        <div className="flex justify-between text-xs mb-1">
                                            <span>Stop Loss Threshold</span>
                                            <span className="text-red-500">{(stopLossPct * 100).toFixed(1)}%</span>
                                        </div>
                                        <input 
                                            type="number" step="0.001" 
                                            value={stopLossPct}
                                            onChange={(e) => setStopLossPct(parseFloat(e.target.value))}
                                            className="w-full bg-[#0a0a0a] border border-gray-800 rounded px-2 py-1 text-xs text-right text-gray-300 focus:border-red-500 outline-none transition-colors"
                                        />
                                    </div>
                                </div>

                                {/* TELEGRAM COMMANDS */}
                                <div className="space-y-3 pt-2 border-t border-gray-800">
                                    <div className="text-[10px] font-bold text-blue-500 uppercase flex items-center gap-1">
                                        <Send size={10} /> Telegram Remote Control
                                    </div>
                                    <div className="grid grid-cols-2 gap-2">
                                        <button onClick={() => handleTelegramCommand('status')} className="bg-[#0f172a] hover:bg-[#1e293b] text-blue-300 text-[10px] py-2 rounded border border-blue-900/30 flex items-center justify-center gap-1 transition-colors">
                                            <PieChart size={12} /> STATUS REPORT
                                        </button>
                                        <button onClick={() => handleTelegramCommand('prices')} className="bg-[#0f172a] hover:bg-[#1e293b] text-green-300 text-[10px] py-2 rounded border border-green-900/30 flex items-center justify-center gap-1 transition-colors">
                                            <List size={12} /> SEND PRICES
                                        </button>
                                        <button onClick={() => handleTelegramCommand('wallet')} className="bg-[#0f172a] hover:bg-[#1e293b] text-yellow-300 text-[10px] py-2 rounded border border-yellow-900/30 flex items-center justify-center gap-1 transition-colors col-span-2">
                                            <Wallet size={12} /> FULL WALLET BREAKDOWN
                                        </button>
                                    </div>
                                </div>

                                <div className="pt-2 flex flex-col gap-2">
                                    <button 
                                        onClick={() => setIsAutoTrading(!isAutoTrading)}
                                        className={`w-full py-3 rounded-lg font-bold flex items-center justify-center gap-2 transition-all ${isAutoTrading ? "bg-purple-600 text-white shadow-[0_0_15px_rgba(147,51,234,0.5)]" : "bg-gray-700 text-gray-300 hover:bg-gray-600"}`}
                                    >
                                        {isAutoTrading ? <ShieldCheck size={16} /> : <AlertTriangle size={16} />}
                                        {isAutoTrading ? "AUTO-TRADING ON" : "ACTIVATE BOT"}
                                    </button>
                                    
                                    <div className="flex gap-2">
                                        <button 
                                            onClick={connectWebSocket}
                                            className="flex-1 py-2 rounded-lg font-bold flex items-center justify-center gap-2 transition-all bg-blue-900/20 hover:bg-blue-900/40 text-blue-400 text-[10px]"
                                        >
                                            <RefreshCw size={12} /> RECONNECT
                                        </button>
                                        <button 
                                            onClick={resetData}
                                            className="flex-1 py-2 rounded-lg font-bold flex items-center justify-center gap-2 transition-all bg-red-900/20 hover:bg-red-900/40 text-red-500 text-[10px]"
                                        >
                                            <Trash2 size={12} /> RESET DATA
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                        </div>
                    </div>
                    </main>

                    {/* PORTFOLIO */}
                    <aside className="w-1/5 min-w-[240px] bg-[#111] border-l border-gray-800 flex flex-col">
                    <div className="p-3 bg-[#1a1a1a] border-b border-gray-800 text-xs font-bold text-gray-500 flex items-center gap-2">
                        <Wallet size={14} /> POSITIONS
                    </div>
                    <div className="overflow-y-auto flex-1 p-2 space-y-2">
                        <div className="px-2 py-1 text-[10px] text-gray-500 uppercase border-b border-gray-800 mb-2 flex justify-between">
                             <span>Realized PnL</span>
                             <span className={realizedPnL >= 0 ? "text-green-500" : "text-red-500"}>${realizedPnL.toFixed(2)}</span>
                        </div>
                        {Object.keys(portfolio).length === 0 ? (
                        <div className="h-full flex flex-col items-center justify-center text-gray-700 gap-2">
                            <Wallet size={32} className="opacity-20" />
                            <span className="text-xs">No active positions</span>
                        </div>
                        ) : (
                        Object.entries(portfolio).map(([symbol, qty]) => {
                            const stock = stocks.find(s => s.symbol === symbol);
                            const val = stock.price * qty;
                            const entry = entryPrices[symbol];
                            const pnl = entry ? ((stock.price - entry) / entry) * 100 : 0;
                            const isProfit = pnl >= 0;

                            return (
                            <div key={symbol} className="bg-[#1a1a1a] p-3 rounded border border-gray-800 hover:border-gray-600 transition-colors group">
                                <div className="flex justify-between items-center mb-1">
                                <span className="font-bold text-white text-sm group-hover:text-purple-400 transition-colors">{symbol}</span>
                                <span className={`text-xs ${isProfit ? "text-green-500" : "text-red-500"}`}>{pnl > 0 ? "+" : ""}{pnl.toFixed(2)}%</span>
                                </div>
                                <div className="flex justify-between text-xs text-gray-400">
                                <span>{qty.toFixed(4)}</span>
                                <span className="text-cyan-400 font-mono">${val.toLocaleString(undefined, {maximumFractionDigits: 2})}</span>
                                </div>
                                <div className="text-[9px] text-gray-600 text-right mt-1 font-mono">
                                    AVG: ${entry ? formatPrice(entry) : "---"}
                                </div>
                            </div>
                            )
                        })
                        )}
                    </div>
                    </aside>

                </div>

                {/* SYSTEM LOGS */}
                <footer className="h-40 bg-black border-t border-gray-800 flex flex-col font-mono text-sm">
                    <div className="px-4 py-1.5 bg-[#1a1a1a] text-[10px] font-bold text-gray-500 border-b border-gray-800 flex items-center gap-2 tracking-wider">
                    <RefreshCw size={10} className="animate-spin" /> LIVE SYSTEM LOGS
                    </div>
                    <div className="flex-1 overflow-y-auto p-4 space-y-1 text-xs scrollbar-thin scrollbar-thumb-gray-800">
                    {logs.length === 0 && <div className="text-gray-700 italic">&gt; System awaiting user configuration...</div>}
                    {logs.slice().reverse().map((log, i) => (
                        <div key={i} className={`${log.includes("STOP") ? "text-red-400" : log.includes("BOT") ? "text-purple-400" : log.includes("SYS") ? "text-blue-400" : "text-gray-400"} hover:bg-white/5 px-1 rounded`}>
                        <span className="opacity-50 mr-2 select-none">&gt;</span>{log}
                        </div>
                    ))}
                    <div ref={logsEndRef} />
                    </div>
                </footer>

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
