<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EdenNexus | System Data</title>
    <style>
        :root { --bg: #121212; --surface: #1e1e1e; --border: #2c2c2c; --text: #e0e0e0; --text-muted: #888; }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { margin: 0; background: var(--bg); color: var(--text); line-height: 1.6; }
        
        .container { max-width: 1000px; margin: 4rem auto; padding: 0 2rem; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        .header h1 { margin: 0; font-size: 1.5rem; font-weight: 600; letter-spacing: -0.5px;}
        .btn-back { color: var(--text-muted); text-decoration: none; font-size: 0.9rem; transition: color 0.2s; }
        .btn-back:hover { color: #fff; }
        
        .table-container { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; min-width: 800px; }
        th, td { padding: 1rem 1.5rem; border-bottom: 1px solid var(--border); }
        th { font-size: 0.8rem; color: var(--text-muted); font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }
        td { font-size: 0.9rem; color: var(--text); }
        tr:last-child td { border-bottom: none; }
        
        .status-badge { padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: 500; text-transform: uppercase; }
        .status-active { background: rgba(74, 222, 128, 0.1); color: #4ade80; border: 1px solid rgba(74, 222, 128, 0.2); }
        .status-inactive { background: rgba(248, 113, 113, 0.1); color: #f87171; border: 1px solid rgba(248, 113, 113, 0.2); }
        
        .level-badge { color: #a855f7; font-weight: 600; }
        
        .empty-state { padding: 3rem; text-align: center; color: var(--text-muted); font-size: 0.95rem; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Network Directory</h1>
            <a href="{{ url_for('index') }}" class="btn-back">← Back to Dashboard</a>
        </div>

        <div class="table-container">
            {% if users %}
                <table>
                    <thead>
                        <tr>
                            <th>Identifier</th>
                            <th>Email Address</th>
                            <th>Access Tier</th>
                            <th>Status</th>
                            <th>Last Active Sync</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for u in users %}
                            <tr>
                                <td style="font-weight: 500;">{{ u.name }}</td>
                                <td style="color: var(--text-muted);">{{ u.email }}</td>
                                <td><span class="level-badge">{{ u.level }}</span></td>
                                <td>
                                    <span class="status-badge {% if u.status == 'active' %}status-active{% else %}status-inactive{% endif %}">
                                        {{ u.status }}
                                    </span>
                                </td>
                                <td style="color: var(--text-muted); font-family: monospace;">{{ u.last_active }}</td>
                            </tr>
                        {% endfor %}
                    </tbody>
                </table>
            {% else %}
                <div class="empty-state">
                    No active nodes found in the system registry.
                </div>
            {% endif %}
        </div>
    </div>

</body>
</html>
